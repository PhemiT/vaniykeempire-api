name: Transcode Video to HLS

on:
  workflow_dispatch:
    inputs:
      contentId:
        description: MongoDB content document ID
        required: true
        type: string
      r2Key:
        description: R2 key of the raw MP4 (e.g. videos/{contentId}/raw/original.mp4)
        required: true
        type: string

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id     ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region        auto

      - name: Download raw MP4 from R2
        run: |
          aws s3 cp \
            s3://${{ secrets.R2_BUCKET_NAME }}/${{ inputs.r2Key }} \
            ./original.mp4 \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Transcode to multi-bitrate HLS
        run: |
          mkdir -p hls/1080p hls/720p hls/480p

          # 1080p
          ffmpeg -i original.mp4 \
            -vf scale=1920:1080 \
            -c:v libx264 -b:v 5000k -maxrate 5500k -bufsize 10000k \
            -c:a aac -b:a 128k \
            -hls_time 6 -hls_playlist_type vod \
            -hls_segment_filename hls/1080p/seg%03d.ts \
            hls/1080p/playlist.m3u8

          # 720p
          ffmpeg -i original.mp4 \
            -vf scale=1280:720 \
            -c:v libx264 -b:v 2800k -maxrate 3000k -bufsize 6000k \
            -c:a aac -b:a 128k \
            -hls_time 6 -hls_playlist_type vod \
            -hls_segment_filename hls/720p/seg%03d.ts \
            hls/720p/playlist.m3u8

          # 480p
          ffmpeg -i original.mp4 \
            -vf scale=854:480 \
            -c:v libx264 -b:v 1400k -maxrate 1600k -bufsize 3200k \
            -c:a aac -b:a 128k \
            -hls_time 6 -hls_playlist_type vod \
            -hls_segment_filename hls/480p/seg%03d.ts \
            hls/480p/playlist.m3u8

          # Master playlist
          cat > hls/master.m3u8 <<'EOF'
          #EXTM3U
          #EXT-X-VERSION:3
          #EXT-X-STREAM-INF:BANDWIDTH=5128000,RESOLUTION=1920x1080
          1080p/playlist.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=2928000,RESOLUTION=1280x720
          720p/playlist.m3u8
          #EXT-X-STREAM-INF:BANDWIDTH=1528000,RESOLUTION=854x480
          480p/playlist.m3u8
          EOF

      - name: Upload HLS files to R2
        run: |
          aws s3 cp hls/ \
            s3://${{ secrets.R2_BUCKET_NAME }}/videos/${{ inputs.contentId }}/hls/ \
            --recursive \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Delete raw MP4 from R2
        run: |
          aws s3 rm \
            s3://${{ secrets.R2_BUCKET_NAME }}/${{ inputs.r2Key }} \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

      - name: Notify backend webhook
        run: |
          curl -X POST ${{ secrets.BACKEND_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ secrets.BACKEND_WEBHOOK_SECRET }}" \
            -d '{
              "contentId": "${{ inputs.contentId }}",
              "hlsKey":    "videos/${{ inputs.contentId }}/hls/master.m3u8"
            }'
